name: build and push binary to release

on:
  release:
    types: [created,published] # Run when a new release is created

jobs:
  build-go-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin] # Operating systems to build for
        goarch: [amd64, arm64] # Architectures to build for
        exclude: # Exclude certain platforms and architectures
          - goarch: arm64
            goos: windows
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker cp $(docker create --rm docker.cnb.cool/opsre/go-ldap-admin-ui):/app/dist public/static/dist
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # A default variable used to add files to a release
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: "https://go.dev/dl/go1.25.1.linux-amd64.tar.gz" # Specify the Golang version to use for the build
          binary_name: "go-ldap-admin" # Specify the binary file name
          extra_files: LICENSE config.yml README.md # Additional files to include