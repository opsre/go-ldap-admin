# delelopment
system:
  # Set the mode (debug/release/test; use release for production)
  mode: debug
  # URL prefix
  url-path-prefix: api
  # Application listen port
  port: 8888
  # Whether to initialize data (use when no initial data exists; set to false for a release)
  init-data: true

logs:
  # Log level (-1: Debug, 0: Info, 1: Warn, 2: Error, 3: DPanic, 4: Panic, 5: Fatal; -1<=level<=5; see zap.level source)
  level: -1
  # Log path
  path: data/logs
  # Maximum file size, MB
  max-size: 50
  # Number of backups
  max-backups: 100
  # Retention period, days
  max-age: 30
  # Whether to compress
  compress: false

database:
  # Database type: mysql or sqlite3
  driver: sqlite3
  # Path to the SQLite3 database file
  source: data/go-ldap-admin.db

mysql:
  # Username
  username: root
  # Password
  password: 123456
  # Database name
  database: go_ldap_admin
  # Host address
  host: localhost
  # Port
  port: 3306
  # Connection string parameters
  query: parseTime=True&loc=Local&timeout=10000ms
  # Whether to print logs
  log-mode: true
  # Database table prefix (do not add a trailing underscore; the program handles it)
  table-prefix: tb
  # Encoding
  charset: utf8mb4
  # Collation (utf8mb4_general_ci is faster than utf8mb4_unicode_ci)
  collation: utf8mb4_general_ci

# JWT configuration
jwt:
  # JWT realm
  realm: test jwt
  # Server key
  key: secret key
  # Token expiration time, hours
  timeout: 12000
  # Maximum token refresh time, hours
  max-refresh: 12000

# Token bucket rate limit configuration
rate-limit:
  # Interval between adding tokens, milliseconds
  fill-interval: 50
  # Bucket capacity
  capacity: 200

i18n:
  # Default language
  default-locale: zh-CN
  # Supported locales
  supported-locales:
    - zh-CN
    - en-US
    - ja-JP
    - es-ES
    - ko-KR

# email configuration
email:
  port: '465'
  user: 'eryajf@163.com'
  from: 'go-ldap-admin后台'
  host: 'smtp.163.com'
  # is-ssl: true
  pass: 'your password'

# # LDAP configuration
ldap:
  # LDAP server address
  url: ldap://localhost:389
  # Maximum LDAP connections
  max-conn: 10
  # LDAP base DN
  base-dn: "dc=eryajf,dc=net"
  # LDAP admin DN
  admin-dn: "cn=admin,dc=eryajf,dc=net"
  # LDAP admin password
  admin-pass: "123456"
  # LDAP user OU
  user-dn: "ou=people,dc=eryajf,dc=net"
  # Default initial LDAP user password
  user-init-password: "123456"
  # Whether group DNs can be changed
  group-name-modify: false
  # Whether user DNs can be changed
  user-name-modify: false
  # User password encryption; defaults to ssha, or can be set to clear (no encryption)
  user-password-encryption-type: "ssha"
  # Default email suffix
  default-email-suffix: "eryajf.net"
  # Whether to sync data from this LDAP server to the database. For a new setup, leave false; the sync button will then be hidden
  enable-sync: false
# Even if the following three configuration sections are not used, do not remove them; doing so may cause unexpected errors
dingtalk:
  # For details about this configuration, see: http://ldapdoc.eryajf.net/pages/94f43a/
  flag: "dingtalk" # DingTalk identifier on the platform
  app-key: "xxxxxxxxxxxxxxx" # Application key
  app-secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxx" # Application secret
  agent-id: "12121212" # agent-id is not currently used and can be ignored
  enable-sync: false  # Whether to enable scheduled DingTalk synchronization
  dept-sync-time: "0 30 2 * * *" # Department sync time: second minute hour day month week; set it between 1 and 5 a.m.
  user-sync-time: "0 30 3 * * *" # User sync time: second minute hour day month week; set it between 1 and 5 a.m. Run user sync after department sync, for example, if departments sync at 2 a.m., sync users at 3 a.m.
  dept-list:    # Departments to sync. Leave empty to sync all departments; prefix an entry with ^ to exclude it
    #- "48456726"   # Department ID to sync
    #- "^61213417"  # Department ID to exclude
  is-update-syncd: false # Whether to sync changes to DingTalk user email, phone, department, and other details. Defaults to false; leave disabled if unsure
  user-leave-range: 0 #Query users who left within the configured number of days; 0 means no limit
wecom:
  # For details about this configuration, see: http://ldapdoc.eryajf.net/pages/cf1698/
  flag: "wecom" # WeCom identifier on the platform
  corp-id: "xxxx" # WeCom company ID
  agent-id: 1000003 # Application ID created in WeCom
  corp-secret: "xxxxx" # Application secret created in WeCom
  enable-sync: false # Whether to enable scheduled WeCom synchronization
  dept-sync-time: "0 30 2 * * *" # Department sync time: second minute hour day month week; set it between 1 and 5 a.m.
  user-sync-time: "0 30 3 * * *" # User sync time: second minute hour day month week; set it between 1 and 5 a.m. Run user sync after department sync, for example, if departments sync at 2 a.m., sync users at 3 a.m.
  is-update-syncd: false # Whether to sync changes to WeCom user email, phone, department, and other details. Defaults to false; leave disabled if unsure
feishu:
  # For details about this configuration, see: http://ldapdoc.eryajf.net/pages/83c90b/
  flag: "feishu" # Feishu identifier on the platform
  app-id: "xxxxxxx" # Feishu app ID
  app-secret: "xxxxxxxxxxx" # Feishu app secret
  enable-sync: false  # Whether to enable scheduled Feishu synchronization
  dept-sync-time: "0 20 0 * * *" # Department sync time: second minute hour day month week; set it between 1 and 5 a.m.
  user-sync-time: "0 40 0 * * *" # User sync time: second minute hour day month week; set it between 1 and 5 a.m. Run user sync after department sync, for example, if departments sync at 2 a.m., sync users at 3 a.m.
  dept-list:    # Departments to sync. Leave empty to sync all departments; prefix an entry with ^ to exclude it
    #- "48456726"   # Department ID to sync
    #- "^61213417"  # Department ID to exclude
  is-update-syncd: false # Whether to sync changes to Feishu user email, phone, department, and other details. Defaults to false; leave disabled if unsure
